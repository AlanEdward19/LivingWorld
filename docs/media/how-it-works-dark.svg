<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Como o Living World funciona: o cenário entra no motor determinístico, que grava estado e eventos; a API projeta para o cliente Godot e para a LLM, que só narra e nunca escreve no mundo">
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9CC3B8"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#F87171"/></marker>
  </defs>
  <rect width="1200" height="380" rx="18" fill="#0B1A17"/>
  <rect x="30" y="110" width="200" height="150" rx="12" fill="#13302A" stroke="#2A5A4E" stroke-width="1.5"/><text x="130.0" y="144" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6F2EE">Cenário</text><text x="130.0" y="172" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">período, mapa, famílias</text><text x="130.0" y="194" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">profissões, regras</text><text x="130.0" y="216" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">só dados (JSON)</text>
  <rect x="280" y="95" width="300" height="180" rx="12" fill="#13302A" stroke="#34D399" stroke-width="2.5"/><text x="430.0" y="129" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6F2EE">Motor determinístico</text><text x="430.0" y="157" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">RNG semeado do mundo</text><text x="430.0" y="179" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">população · economia · cidades</text><text x="430.0" y="201" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">história · ontogenia · cognição</text><text x="430.0" y="223" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">utility AI decide por NPC</text>
  <rect x="630" y="110" width="220" height="150" rx="12" fill="#13302A" stroke="#2A5A4E" stroke-width="1.5"/><text x="740.0" y="144" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6F2EE">Estado + eventos</text><text x="740.0" y="172" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">snapshot canônico (hash)</text><text x="740.0" y="194" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">event log com causa</text><text x="740.0" y="216" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">SQLite → Postgres</text>
  <rect x="910" y="40" width="260" height="120" rx="12" fill="#13302A" stroke="#2A5A4E" stroke-width="1.5"/><text x="1040.0" y="74" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6F2EE">API .NET → Godot</text><text x="1040.0" y="102" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">mapa, cidades e NPCs</text><text x="1040.0" y="124" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">painel “ver o cérebro”</text>
  <rect x="910" y="220" width="260" height="120" rx="12" fill="#13302A" stroke="#2A5A4E" stroke-width="1.5"/><text x="1040.0" y="254" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6F2EE">LLM (opcional)</text><text x="1040.0" y="282" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">conversa e narra</text><text x="1040.0" y="304" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">o motor valida tudo</text>
  <line x1="230" y1="185" x2="276" y2="185" stroke="#9CC3B8" stroke-width="2" marker-end="url(#n)"/>
  <line x1="580" y1="185" x2="626" y2="185" stroke="#9CC3B8" stroke-width="2" marker-end="url(#n)"/>
  <line x1="850" y1="160" x2="906" y2="110" stroke="#9CC3B8" stroke-width="2" marker-end="url(#n)"/>
  <line x1="850" y1="210" x2="906" y2="270" stroke="#9CC3B8" stroke-width="2" marker-end="url(#n)"/>
  <line x1="908" y1="300" x2="586" y2="258" stroke="#F87171" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#w)"/>
  <text x="748" y="324" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F87171">nunca escreve no mundo</text>
  <text x="430" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CC3B8">o mundo avança sozinho, sem jogador e sem LLM</text>
</svg>
